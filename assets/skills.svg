<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 290" width="1200" height="290" role="img" aria-labelledby="t d">
  <title id="t">Lima skill pawang-skills dan hubungannya</title>
  <desc id="d">Lima kubus: make-theme, panduan-brand, plans-prototype, interview, pawang-skill-creator. Tiga skill pertama memanggil interview; make-theme menjadi bahan panduan-brand, lalu panduan-brand dilanjutkan plans-prototype.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0E1A33"/><stop offset="1" stop-color="#1B2B52"/></linearGradient>
    <clipPath id="panel"><rect width="1200" height="290" rx="24"/></clipPath>
    <marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M1,1L9,5L1,9z" fill="#FFF6E9"/></marker>
    <g id="cube">
      <polygon points="0,-40 34.64,-20 34.64,20 0,40 -34.64,20 -34.64,-20" fill="currentColor"/>
      <polygon points="0,-40 34.64,-20 0,0 -34.64,-20" fill="#fff" fill-opacity=".32"/>
      <polygon points="-34.64,-20 0,0 0,40 -34.64,20" fill="#fff" fill-opacity=".04"/>
      <polygon points="0,0 34.64,-20 34.64,20 0,40" fill="#0B1226" fill-opacity=".40"/>
      <path d="M0,0V40M0,0L-34.64,-20M0,0L34.64,-20" stroke="#fff" stroke-opacity=".38" stroke-width="1.2" fill="none"/>
      <polygon points="0,-40 34.64,-20 34.64,20 0,40 -34.64,20 -34.64,-20" fill="none" stroke="#fff" stroke-opacity=".22"/>
    </g>
  </defs>
  <style>
    text{font-family:'Avenir Next','Segoe UI','Helvetica Neue',system-ui,-apple-system,sans-serif}
    .f2{animation:float2 6s ease-in-out infinite}
    @keyframes float2{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
    .flow{fill:none;stroke-width:2;stroke-dasharray:6 8;stroke-linecap:round;animation:dash 1.6s linear infinite}
    @keyframes dash{to{stroke-dashoffset:-28}}
    @media (prefers-reduced-motion:reduce){.f2,.flow{animation:none}}
  </style>
  <g clip-path="url(#panel)">
    <rect width="1200" height="290" fill="url(#bg)"/>
    <path class="flow" d="M140,86 C140,10 815,10 815,86" stroke="#FF8A3D" stroke-opacity="0.9"/>
    <path class="flow" d="M365,86 C365,34 815,34 815,86" stroke="#FF8A3D" stroke-opacity="0.9"/>
    <path class="flow" d="M590,86 C590,48 815,48 815,86" stroke="#FF8A3D" stroke-opacity="0.9"/>
    <text x="477" y="20" text-anchor="middle" font-size="13" fill="#A9B6D3">tiga skill ini memanggil interview</text>
    <path class="flow" d="M188,132 H313" stroke="#3FB8AF" stroke-opacity=".8" marker-end="url(#ar)"/>
    <path class="flow" d="M413,132 H538" stroke="#F2C14E" marker-end="url(#ar)"/>
    <g class="f2" style="animation-delay:0.0s"><use href="#cube" color="#3FB8AF" transform="translate(140 132) scale(1)"/></g>
    <g class="f2" style="animation-delay:-1.3s"><use href="#cube" color="#F2C14E" transform="translate(365 132) scale(1)"/></g>
    <g class="f2" style="animation-delay:-2.6s"><use href="#cube" color="#6C8CFF" transform="translate(590 132) scale(1)"/></g>
    <g class="f2" style="animation-delay:-3.9000000000000004s"><use href="#cube" color="#FF8A3D" transform="translate(815 132) scale(1)"/></g>
    <g class="f2" style="animation-delay:-5.2s"><use href="#cube" color="#E86A92" transform="translate(1040 132) scale(1)"/></g>
    <text x="140" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF6E9">make-theme</text><text x="140" y="240" text-anchor="middle" font-size="14" fill="#3FB8AF" font-weight="600">Tema brand</text><text x="140" y="260" text-anchor="middle" font-size="13" fill="#A9B6D3">Metafora, palet, tipografi, token</text>
    <text x="365" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF6E9">panduan-brand</text><text x="365" y="240" text-anchor="middle" font-size="14" fill="#F2C14E" font-weight="600">Panduan brand</text><text x="365" y="260" text-anchor="middle" font-size="13" fill="#A9B6D3">Dokumen .md lengkap</text>
    <text x="590" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF6E9">plans-prototype</text><text x="590" y="240" text-anchor="middle" font-size="14" fill="#6C8CFF" font-weight="600">Rencana prototype</text><text x="590" y="260" text-anchor="middle" font-size="13" fill="#A9B6D3">PRD, flow, desain, edge case</text>
    <text x="815" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF6E9">interview</text><text x="815" y="240" text-anchor="middle" font-size="14" fill="#FF8A3D" font-weight="600">Wawancara</text><text x="815" y="260" text-anchor="middle" font-size="13" fill="#A9B6D3">Ronde bernomor, tanpa asumsi</text>
    <text x="1040" y="216" text-anchor="middle" font-size="17" font-weight="700" fill="#FFF6E9">pawang-skill-creator</text><text x="1040" y="240" text-anchor="middle" font-size="14" fill="#E86A92" font-weight="600">Pembuat skill</text><text x="1040" y="260" text-anchor="middle" font-size="13" fill="#A9B6D3">Buat, audit, perbaiki skill</text>

  </g>
</svg>
