name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4.2.2
      - name: Validasi skill dan manifest
        run: bash scripts/validate-all.sh
      - name: Pastikan tag sama dengan versi manifest
        run: |
          version="$(python3 -c 'import json; print(json.load(open(".claude-plugin/plugin.json"))["version"])')"
          if [ "v${version}" != "${GITHUB_REF_NAME}" ]; then
            echo "Tag ${GITHUB_REF_NAME} tidak sama dengan versi manifest v${version}"; exit 1
          fi
      - name: Kemas semua skill
        run: bash scripts/package.sh
      - name: Buat GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "${GITHUB_REF_NAME}" dist/*.zip dist/*.skill --title "${GITHUB_REF_NAME}" --generate-notes
